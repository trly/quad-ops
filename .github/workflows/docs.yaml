name: Docs

# This workflow builds docs for all pushes and PRs but only deploys when:
# 1. A v* tag is pushed (to satisfy GitHub environment protection rules)
# 2. Manual workflow dispatch is triggered

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'site/**'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: cd site && hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only deploy when a v* tag is pushed or via manual workflow_dispatch
    # This satisfies GitHub's environment protection rules for the github-pages environment
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
